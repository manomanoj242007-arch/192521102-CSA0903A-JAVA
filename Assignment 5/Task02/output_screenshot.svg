<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="520" viewBox="0 0 1250 520"><rect width="1250" height="520" fill="#0d1117"/><rect width="1250" height="58" fill="#21262d"/><circle cx="26" cy="29" r="7" fill="#ff5f56"/><circle cx="52" cy="29" r="7" fill="#ffbd2e"/><circle cx="78" cy="29" r="7" fill="#27c93f"/><text x="110" y="37" fill="#e6edf3" font-family="Arial" font-size="22">Assignment 5 - Task02 - Console Output</text><text x="36" y="105" fill="#7ee787" font-family="monospace" font-size="18">TASK A2 - BUFFERED I/O DESIGN</text><text x="36" y="148" fill="#e6edf3" font-family="monospace" font-size="18">Input size: 50 MiB = 52,428,800 bytes</text><text x="36" y="191" fill="#e6edf3" font-family="monospace" font-size="18">Single-byte strategy: about 52,428,800 read calls</text><text x="36" y="234" fill="#e6edf3" font-family="monospace" font-size="18">Buffered strategy: bulk reads in fixed-size blocks</text><text x="36" y="277" fill="#e6edf3" font-family="monospace" font-size="18">Time complexity: O(N) for both approaches</text><text x="36" y="320" fill="#e6edf3" font-family="monospace" font-size="18">Extra memory: O(1) stream state vs O(B) buffer</text><text x="36" y="363" fill="#e6edf3" font-family="monospace" font-size="18">readAllLines: O(N) memory plus line objects</text></svg>