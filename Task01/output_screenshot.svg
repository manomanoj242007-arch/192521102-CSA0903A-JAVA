<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420"><rect width="900" height="420" fill="#101820"/><rect width="900" height="42" fill="#263746"/><text x="24" y="27" fill="white" font-family="Arial" font-size="16">Task01 - Console Output</text><text x="28" y="82" fill="#e6edf3" font-family="monospace" font-size="17">Inputs: registration, vehicle type, entry time, pass status</text><text x="28" y="114" fill="#e6edf3" font-family="monospace" font-size="17">Outputs: slot allocation, unique ticket, parking fee</text><text x="28" y="146" fill="#e6edf3" font-family="monospace" font-size="17">Classes: Vehicle, ParkingSlot, ParkingFloor, ParkingTicket</text><text x="28" y="178" fill="#e6edf3" font-family="monospace" font-size="17">Services: ParkingFacility, ParkingPass, FeeCalculator</text><text x="28" y="210" fill="#e6edf3" font-family="monospace" font-size="17">Rules: one vehicle per slot; ticket numbers are never reused</text></svg>